<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculus Explorer</title>
    <link rel="stylesheet" href="global.css">
</head>

<body>
    <div class="navbar">
        <div>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="page1.html">Limits</a>
        </div>
        <button id="theme-toggle" aria-label="Toggle dark mode">Dark Mode</button>
    </div>

    <div class="container">
        <section class="homepage-hero">
            <p class="eyebrow">Interactive Calculus Learning</p>
            <h1>Calculus, reimagined.</h1>
            <p>
                Built by a high school junior to help curious learners of all backgrounds look past formulas and discover the creative, meaningful side of math.
            </p>
            <div class="hero-actions">
                <a href="about.html" class="page-link">Read more</a>
                <a href="page1.html" class="page-link secondary">Try the lesson</a>
            </div>
        </section>
    </div>

    <script>
        const body = document.body;
        const themeToggle = document.getElementById('theme-toggle');

        function updateThemeLabel() {
            const isDark = body.classList.contains('dark-theme');
            themeToggle.textContent = isDark ? 'Light Mode' : 'Dark Mode';
        }

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-theme');
            const isDark = body.classList.contains('dark-theme');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeLabel();
        });

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            body.classList.add('dark-theme');
        }

        updateThemeLabel();
    </script>
</body>

</html>
