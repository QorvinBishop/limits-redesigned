<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limit Glitch V1.0 - Calculus Learning Game</title>
    <!-- Desmos API v1.12 -->
<script src="https://www.desmos.com/api/v1.12/calculator.js?apiKey=96521a4ac4da457faf78d413efb60a90"></script>
    
    <!-- KaTeX for beautiful math rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body);"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body id="body">

    <div id="noise-overlay"></div>

    <div id="top-bar">
        <div class="brand">LIMIT_GLITCH v1.0</div>
        <div class="stats">
            <span>SCORE: <span id="score-val">0</span></span>
            <span>LEVEL: <span id="level-idx">1</span>/5</span>
            <div id="stars">
                <span class="star">★</span><span class="star">★</span><span class="star">★</span>
            </div>
        </div>
    </div>

    <div id="mode-selector">
        <button class="secondary" onclick="game.filterLevels('removable')">REMOVABLE</button>
        <button class="secondary" onclick="game.filterLevels('infinite')">INFINITE</button>
        <button class="secondary" onclick="game.filterLevels('mixed')">MIXED</button>
        <button class="secondary" onclick="game.resetProgress()" style="margin-left: auto; border-color: #666; color: #666;">RESET</button>
    </div>

    <div id="game-container">
        <div id="calculator"></div>
        
        <div id="control-panel">
            <div class="level-info">
                <h2 id="level-name">Loading...</h2>
                <div class="math-display">
                    <span id="func-display">f(x) = ...</span><br>
                    <small>Target: <span id="target-x-display">?</span></small>
                </div>
                <div id="coord-display">x: 0.00, y: 0.00</div>
            </div>

            <div class="inputs">
                <div class="slider-container">
                    <label>Explore Approach:</label>
                    <input type="range" id="x-slider" min="-10" max="10" step="0.01" value="0">
                </div>
                
                <div class="guess-container">
                    <input type="text" id="guess-input" placeholder="Enter Limit Value (or 'DNE')">
                    <button onclick="game.submitGuess()">SUBMIT</button>
                </div>
            </div>
        </div>
    </div>

    <div id="status-bar">
        STATUS: <span id="status-msg">SYSTEM_READY</span>
    </div>

    <!-- Completion Overlay -->
    <div id="completion-overlay" class="overlay">
        <h1 id="completion-title">LEVEL_CLEARED</h1>
        <div id="solution-display"></div>
        <div style="margin-top: 20px; display: flex; gap: 10px;">
            <button onclick="game.nextLevel()">NEXT_LEVEL</button>
            <button class="secondary" onclick="game.closeOverlay()">REPLAY</button>
        </div>
    </div>

    <script defer src="script.js"></script>
</body>
</html>
